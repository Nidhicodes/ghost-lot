# Render spins the free API down after 15 idle minutes, and waking it takes about a minute.
# Ping /api/health every 10 minutes so visitors (and judges) get a warm API.
# One free service running all month uses at most 744 of Render's 750 free instance hours.
# GitHub may delay scheduled runs and pauses them after 60 days without repo activity.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 https://ghost-lot-api.onrender.com/api/health
